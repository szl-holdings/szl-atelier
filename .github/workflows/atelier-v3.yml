name: Atelier v3 source qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "frontier/atelier_v3/**"
      - ".github/workflows/atelier-v3.yml"
      - "FRONTIER_PLAN.md"
  push:
    branches: [main]
    paths:
      - "frontier/atelier_v3/**"
      - ".github/workflows/atelier-v3.yml"
      - "FRONTIER_PLAN.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atelier-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: atelier-v3/qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: frontier/atelier_v3/requirements.txt

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement frontier/atelier_v3/requirements.txt

      - name: Prove backend and receipt contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            frontier/atelier_v3/app.py \
            frontier/atelier_v3/catalog.py \
            frontier/atelier_v3/tests/test_app.py
          python -m pytest -q frontier/atelier_v3/tests

      - name: Prove local-only frontend and accessibility primitives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html = Path('frontier/atelier_v3/static/index.html').read_text()
          js = Path('frontier/atelier_v3/static/app.js').read_text()
          css = Path('frontier/atelier_v3/static/styles.css').read_text()
          forbidden_html = ('http://', 'https://', '<iframe', 'analytics', 'localStorage', 'sessionStorage')
          present = [value for value in forbidden_html if value in html]
          if present:
              raise SystemExit(f'forbidden frontend dependencies: {present}')
          required_html = ('viewport-fit=cover', 'skip-link', 'aria-live', '<dialog', '/styles.css', '/app.js')
          missing = [value for value in required_html if value not in html]
          if missing:
              raise SystemExit(f'missing accessibility primitives: {missing}')
          required_css = (
              '@media (max-width: 30rem)',
              '@media (prefers-reduced-motion: reduce)',
              '@media (prefers-contrast: more)',
              '@media (forced-colors: active)',
              '@media (pointer: coarse)',
              '@media print',
              ':focus-visible',
          )
          missing_css = [value for value in required_css if value not in css]
          if missing_css:
              raise SystemExit(f'missing responsive contracts: {missing_css}')
          if 'innerHTML' in js or 'insertAdjacentHTML' in js:
              raise SystemExit('unsafe dynamic HTML sink present')
          print('frontend qualification: PASS')
          PY

      - name: Verify mutation and credential boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('frontier/atelier_v3/app.py').read_text()
          forbidden = (
              'subprocess.', 'os.system(', 'eval(', 'exec(',
              '@app.post(', '@app.put(', '@app.patch(', '@app.delete(',
              'Authorization', 'HF_TOKEN', 'HUGGING_FACE_HUB_TOKEN',
          )
          present = [value for value in forbidden if value in source]
          if present:
              raise SystemExit(f'forbidden backend authority: {present}')
          required = ('MAX_PROVIDER_BYTES', 'PROVIDER_TIMEOUT_SECONDS', 'NoRedirect', 'mutation_authority', 'secrets_recorded')
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit(f'missing backend bounds: {missing}')
          print('authority qualification: PASS')
          PY

      - name: Build non-root container
        shell: bash
        run: |
          set -euo pipefail
          docker build --file frontier/atelier_v3/Dockerfile --tag szl-atelier-v3:${GITHUB_SHA} .
          test "$(docker image inspect --format '{{.Config.User}}' szl-atelier-v3:${GITHUB_SHA})" = "10001:10001"

      - name: Verify clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
