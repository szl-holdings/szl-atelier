name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Prove exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${SOURCE_REVISION}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci/runtime-contract.txt
      - name: Install contract dependencies
        run: python -m pip install --require-hashes --requirement requirements/ci/runtime-contract.txt
      - name: Compile and test
        run: |
          python -m compileall -q server.py tests
          python -m pytest -q
      - name: Witness live HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn server:app --host 127.0.0.1 --port 7860 > /tmp/szl-atelier.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/szl-atelier.log' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:7860/readyz", timeout=2) as response:
                      payload = json.load(response)
                  if payload.get("status") == "ready" and payload.get("catalog_records") == 40:
                      break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(0.5)
          else:
              raise RuntimeError("readiness never converged")

          for path in ("/healthz", "/api/build-info", "/"):
              with urllib.request.urlopen("http://127.0.0.1:7860" + path, timeout=3) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned {response.status}")
          PY
      - name: Build Docker runtime
        run: docker build --tag "szl-atelier:${SOURCE_REVISION}" .
      - name: Smoke the Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          # The witness above runs on the runner's Python; this runs the image the
          # Dockerfile ships and holds it to the readiness contract and to the
          # interpreter RELEASE.json declares.
          docker run --detach --name szl-atelier-smoke \
            --publish 127.0.0.1:17861:7860 \
            "szl-atelier:${SOURCE_REVISION}" >/dev/null
          trap 'docker logs szl-atelier-smoke 2>&1 | tail -n 40 || true; docker rm --force szl-atelier-smoke >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:17861"

          def read(path):
              with urllib.request.urlopen(base + path, timeout=5) as response:
                  return json.load(response)

          deadline = time.monotonic() + 120
          while True:
              try:
                  ready = read("/readyz")
                  break
              except (urllib.error.URLError, ConnectionError, OSError):
                  if time.monotonic() > deadline:
                      raise SystemExit("Docker runtime never became ready on /readyz")
                  time.sleep(2)
          assert ready.get("status") == "ready" and ready.get("catalog_records") == 40, ready
          build = read("/api/build-info")
          declared = build["release"]["runtime_contract"]["language"]
          served = "Python " + ".".join(build["python"].split(".")[:2])
          assert declared == served, (declared, served)
          print(f"Docker runtime smoke: PASS ({served}, {ready['catalog_records']} records)")
          PY
