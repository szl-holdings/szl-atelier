name: hf-space

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH-SZL-ATELIER-V3 to authorize the exact main projection
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hf-write/space/SZLHOLDINGS/szl-atelier
  cancel-in-progress: false

jobs:
  publish:
    name: hf-space/publish-exact-v3
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirmation == 'PUBLISH-SZL-ATELIER-V3') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      PUBLISH_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      REPORT_PATH: reports/atelier-v3-provider-readback.json

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout exact tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            frontier/atelier_v3/requirements.txt
            frontier/atelier_v3/requirements-publish.txt

      - name: Prove immutable source and current protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PUBLISH_SHA}"
          test "${GITHUB_REPOSITORY}" = "szl-holdings/szl-atelier"
          test "${GITHUB_REF_NAME:-main}" = "main" || test "${GITHUB_EVENT_NAME}" = "workflow_run"
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          observed_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "${observed_main}" != "${PUBLISH_SHA}" ]; then
            echo "::error::Source moved: approved ${PUBLISH_SHA}, current main ${observed_main}."
            exit 1
          fi

      - name: Install exact publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --requirement frontier/atelier_v3/requirements.txt \
            --requirement frontier/atelier_v3/requirements-publish.txt

      - name: Requalify source and publication contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            frontier/atelier_v3/app.py \
            frontier/atelier_v3/catalog.py \
            frontier/atelier_v3/build_publication.py \
            frontier/atelier_v3/publish_space.py \
            frontier/atelier_v3/run.py
          python -m pytest -q frontier/atelier_v3/tests

      - name: Build exact secret-free Docker Space projection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/atelier-v3-space
          mkdir -p dist reports
          python frontier/atelier_v3/build_publication.py \
            --source-sha "${PUBLISH_SHA}" \
            --output dist/atelier-v3-space
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('dist/atelier-v3-space/PUBLICATION_RECEIPT.json').read_text())
          assert receipt['state'] == 'PACKAGE_BUILT_NOT_PUBLISHED'
          assert receipt['source_sha'] == __import__('os').environ['PUBLISH_SHA']
          assert receipt['target']['repository'] == 'SZLHOLDINGS/szl-atelier'
          assert receipt['secrets_recorded'] is False
          print('publication package: PASS')
          PY

      - name: Publish one exact target and prove Hub/runtime convergence
        shell: bash
        run: |
          set -euo pipefail
          python frontier/atelier_v3/publish_space.py \
            --source-sha "${PUBLISH_SHA}" \
            --package dist/atelier-v3-space \
            --report "${REPORT_PATH}" \
            --timeout-seconds 1200

      - name: Upload secret-free provider receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5.0.0
        with:
          name: atelier-v3-provider-readback-${{ env.PUBLISH_SHA }}
          path: reports/atelier-v3-provider-readback.json
          if-no-files-found: warn
          retention-days: 30
