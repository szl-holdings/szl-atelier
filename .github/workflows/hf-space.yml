name: hf-space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Publish static Space SZLHOLDINGS/szl-atelier
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_ORG_TOKEN / HF_TOKEN missing — Space not published this run."
            exit 0
          fi
          pip install -q "huggingface_hub>=0.26"
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          repo_id = "SZLHOLDINGS/szl-atelier"
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="static",
              exist_ok=True,
              private=False,
          )
          root = Path(".")
          api.upload_folder(
              folder_path=str(root),
              repo_id=repo_id,
              repo_type="space",
              allow_patterns=["*.md", "*.html", "*.css", "*.js", "*.json", "*.py", "LICENSE", "kit/*", "cards/*"],
              ignore_patterns=[".git*", ".github/*"],
          )
          print("published", repo_id)
          PY

  # Sibling GitHub sources stay canonical. This job exists because szl-khipu,
  # counsel, ayllu, and szl-experiments do not have the org token bound yet.
  mirror-siblings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-khipu
          path: khipu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/counsel
          path: counsel
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/ayllu
          path: ayllu
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/szl-experiments
          path: experiments
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Mirror siblings onto SZLHOLDINGS
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          HF_ORG: SZLHOLDINGS
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_ORG_TOKEN / HF_TOKEN missing — sibling Hub mirror skipped. GitHub remains source."
            exit 0
          fi
          pip install -q "huggingface_hub>=0.26"
          python khipu/scripts/publish_hf.py
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_repo

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          ignore = [".git*", "tests/*", ".venv/*", "__pycache__/*", ".github/*"]

          create_repo("SZLHOLDINGS/counsel", repo_type="space", space_sdk="gradio", exist_ok=True, token=token)
          api.upload_folder(folder_path="counsel", repo_id="SZLHOLDINGS/counsel", repo_type="space", ignore_patterns=ignore)
          print("published SZLHOLDINGS/counsel")

          create_repo("SZLHOLDINGS/ayllu", repo_type="space", space_sdk="docker", exist_ok=True, token=token)
          api.upload_folder(folder_path="ayllu", repo_id="SZLHOLDINGS/ayllu", repo_type="space", ignore_patterns=ignore)
          print("published SZLHOLDINGS/ayllu")

          create_repo("SZLHOLDINGS/szl-experiments", repo_type="space", space_sdk="docker", exist_ok=True, token=token)
          api.upload_folder(folder_path="experiments", repo_id="SZLHOLDINGS/szl-experiments", repo_type="space", ignore_patterns=ignore)
          print("published SZLHOLDINGS/szl-experiments")
          PY
