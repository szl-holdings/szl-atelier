name: hf-space

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      PUBLISH_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PUBLISH_SHA }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Mirror exact tested commit to Hugging Face
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_ORG_TOKEN or HF_TOKEN is required; nothing was published."
            exit 1
          fi

          askpass="${RUNNER_TEMP}/hf-askpass.sh"
          cat > "${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'oauth2' ;;
            *) printf '%s\n' "${HF_TOKEN}" ;;
          esac
          EOF
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0

          git remote add huggingface https://huggingface.co/spaces/SZLHOLDINGS/szl-atelier
          remote_sha="$(git ls-remote huggingface refs/heads/main | awk '{print $1}')"
          if [ "${remote_sha}" = "${PUBLISH_SHA}" ]; then
            echo "Hugging Face already serves repository head ${PUBLISH_SHA}."
            exit 0
          fi
          if [ -n "${remote_sha}" ] && ! git merge-base --is-ancestor "${remote_sha}" "${PUBLISH_SHA}"; then
            echo "::error::Hugging Face main diverged at ${remote_sha}; refusing a non-fast-forward publish."
            exit 1
          fi

          git lfs push huggingface "${PUBLISH_SHA}"
          git push huggingface "${PUBLISH_SHA}:refs/heads/main"
          observed="$(git ls-remote huggingface refs/heads/main | awk '{print $1}')"
          if [ "${observed}" != "${PUBLISH_SHA}" ]; then
            echo "::error::Expected ${PUBLISH_SHA}, observed ${observed:-UNAVAILABLE}."
            exit 1
          fi
          echo "Published and observed exact commit ${PUBLISH_SHA}."
