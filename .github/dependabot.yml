version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      github_actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    # "/" holds the human-edited ranges; the other three hold the hash locks that CI and the
    # Dockerfiles install with --require-hashes (and the v3 Space pins), so their hashes stay current.
    directories:
      - "/"
      - "/requirements/ci"
      - "/requirements/docker"
      - "/frontier/atelier_v3"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    ignore:
      # python:*-slim ships no compiler and the image's hash-locked installs
      # lack cp315 wheels, so a 3.15 base fails the runtime-contract build
      # (dependabot PR #76, measured-red). Same family as killinchu #639:
      # no cp315 numpy wheel + no compiler in slim images. Lift this hold once
      # every hash-locked Dockerfile install succeeds on 3.15-slim.
      - dependency-name: "python"
        versions: [">=3.15"]
    groups:
      docker:
        patterns:
          - "*"
