[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-atelier"
version = "0.1.0"
description = "SZL Atelier: the legacy curated-gallery FastAPI runtime and the source of the SZLHOLDINGS/szl-atelier Space projection (frontier/atelier_v3)."
readme = "README.md"
# numpy>=2.5.4 in the test extra needs 3.12; CI runs 3.12 and the root image runs 3.14.
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
keywords = ["governed-ai", "szl-holdings", "model-cards", "receipts", "fastapi", "huggingface"]
classifiers = [
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["fastapi>=0.162.0,<1", "uvicorn[standard]>=0.54.0,<1"]

[project.optional-dependencies]
# Mirrors requirements-dev.txt: the root suite also collects frontier/atelier_v3/tests,
# whose publisher tests import huggingface_hub at the exact version the Space writer uses.
test = [
  "httpx>=0.28.1,<1",
  "numpy>=2.5.4,<3",
  "pytest>=9.2.0,<10",
  "huggingface_hub==2.4.0",
]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-atelier"
Source = "https://github.com/szl-holdings/szl-atelier"
Issues = "https://github.com/szl-holdings/szl-atelier/issues"
"Hugging Face Space" = "https://huggingface.co/spaces/SZLHOLDINGS/szl-atelier"

[tool.setuptools]
# server.py serves the gallery files that sit next to it, so run it from a checkout
# (editable install), not from a built wheel.
py-modules = ["server"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "frontier/atelier_v3/tests"]
